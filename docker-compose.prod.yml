## Production stack for /opt/hr_system on the VPS. Separate compose project
## from minimart on the same box — own network, own Postgres container, no
## shared state. Postgres is not published to the host: nothing outside this
## compose network needs to reach it yet.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hr_system
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hr_system
    volumes:
      - hr_system_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_system -d hr_system"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - hr_system_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hr_system_pgdata:
  hr_system_data:
