<footer class="card pad">
  <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:9px">
    <span style="font-size:11px;font-weight:700;color:#5f6875;text-transform:uppercase;letter-spacing:.9px">{{ t('foot.legend') }}</span>
    <span style="font-size:11.5px;color:#79818e">{{ t('foot.legend_note') }}</span>
  </div>
  <div class="legend">
    {% for c in ['P','A','MP','SS','WO','H'] %}
    <div class="li">
      <span class="code" style="background:{{ PALETTE[c].bg }};color:{{ PALETTE[c].fg }};border-color:{{ PALETTE[c].bd }}">{{ c }}</span>
      <div>
        <div class="nm">{{ c }} — {{ t('code.' ~ c) }}</div>
        <div class="ds">{{ t('code.' ~ c ~ '.desc') }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</footer>
