# One shift, because the site does not run fixed ones. Hours paid are always
# the actual time between a person's first and last punch — the shift never
# contributes a number. All it decides is which calendar day a punch belongs to.
#
# Times are local site time (WITA / Asia/Makassar), 24h. Not WIB — an hour of
# error moves the day boundary and the night shift stops landing on its own day.
#
# The boundary is 07:30, the one hour of the day nobody is working: the latest
# anyone finishes is 07:00 (the night crew) and the earliest anyone starts is
# 08:00. So a working day runs 07:30 to 07:30, every pattern fits inside one
# window, and work is credited to the day it STARTED. Somebody clocking in at
# 23:00 and out at 07:00 the next morning is one day's work, on the first date.
#
# The 30 minutes of slack either side is the limit: a night worker still on site
# past 07:30, or a day worker arriving before it, lands on the neighbouring day.
# Widening that is not possible while the two shifts sit an hour apart.
#
# short_hours / long_hours override the global thresholds in .env.
# Below short_hours -> SS exception. Above long_hours -> LONG (cell stays P).

shifts:
  KERJA:
    name: "Jam Kerja"
    start: "07:30"
    end: "07:30"
    window_start: "07:30"
    window_end: "07:30"     # next day — a full 24h, no gaps and no overlap
    crosses_midnight: true
    # Wide on purpose: with no fixed shift there is no expected length, so these
    # only catch the obviously wrong — a 2-minute day, or a missed clock-out.
    short_hours: 3.0
    long_hours: 16.0

# Weekly roster patterns. One char per weekday starting Monday.
#   W = working day, O = week-off (WO)
# An employee references a pattern by key in the employees table.
roster_patterns:
  six_day_sun_off:  "WWWWWWO"
  five_day_weekend: "WWWWWOO"
  continuous:       "WWWWWWW"   # rotating crews; week-off comes from explicit overrides
