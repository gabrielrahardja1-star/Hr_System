# Shift definitions. Times are local (Asia/Jakarta), 24h.
#
# window_start / window_end bound the period in which punches are attributed to
# this shift's work_date. For a night shift the window crosses midnight; a punch
# is always attributed to the calendar date on which the window STARTS.
#
# short_hours / long_hours override the global thresholds in .env for this shift.
# A day coded with worked hours below short_hours -> SS exception.
# Above long_hours -> LONG exception (cell stays P).

shifts:
  S1:
    name: "Shift 1 (Pagi)"
    start: "08:00"
    end: "15:00"
    window_start: "05:00"   # earliest a Shift-1 punch is believable
    window_end: "20:00"     # latest before it rolls into Shift 2 territory
    crosses_midnight: false
    short_hours: 5.0
    long_hours: 12.0

  S2:
    name: "Shift 2 (Sore)"
    start: "16:00"
    end: "00:00"            # midnight -> counts as crossing
    window_start: "13:00"
    window_end: "04:00"     # next day
    crosses_midnight: true
    short_hours: 6.0
    long_hours: 12.0

  S3:
    name: "Shift 3 (Malam)"
    start: "23:00"
    end: "07:00"
    window_start: "20:00"
    window_end: "12:00"     # next day
    crosses_midnight: true
    short_hours: 6.0
    long_hours: 12.0

# Weekly roster patterns. One char per weekday starting Monday.
#   W = working day, O = week-off (WO)
# An employee references a pattern by key in the employees table.
roster_patterns:
  six_day_sun_off:  "WWWWWWO"
  five_day_weekend: "WWWWWOO"
  continuous:       "WWWWWWW"   # rotating crews; week-off comes from explicit overrides
